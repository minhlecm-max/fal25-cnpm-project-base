<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - Theo bàn</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding-top: 90px;
        }
        .cart-container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,.15);
        }
        .cart-header {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            color: white;
            padding: 12px;
            text-align: center;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .cart-item {
            padding: 18px;
            border-bottom: 1px solid #eee;
        }
        .item-image {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
        }
        .quantity-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 2px solid #4ecdc4;
            background: white;
            color: #4ecdc4;
            font-weight: bold;
        }
        .quantity-btn:hover {
            background: #4ecdc4;
            color: white;
        }
        .remove-btn {
            cursor: pointer;
            color: #ff6b6b;
        }
        .cart-summary {
            background: white;
            padding: 20px;
            border-radius: 15px;
            position: sticky;
            top: 90px;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
        }
    </style>
</head>
<body>

<nav class="navbar fixed-top bg-white shadow-sm">
    <div class="container">
        <span class="fw-bold fs-3">Order Menu</span>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-lg-8">
            <div class="cart-container">
                <div class="cart-header">
                    <h3>Danh sách món</h3>
                </div>
                <div id="cart-items-container"></div>
            </div>
        </div>

        <div class="col-lg-4 mt-4 mt-lg-0">
            <div class="cart-summary">
                <h3 class="fw-bold mb-3">🧾 Tóm tắt đơn hàng</h3>
                <div class="mb-3">
                    <label class="form-label fw-bold">Số bàn</label>
                    <select class="form-select" id="table-select"></select>
                </div>


                <div class="mb-3">
                    <label class="form-label fw-bold">Giảm giá (%)</label>
                    <input type="number" class="form-control" id="discount-input">
                </div>

                <div class="d-flex justify-content-between">
                    <span class="form-label fw-bold">Tạm tính</span>
                    <span id="subtotal">0đ</span>
                </div>

                <div class="d-flex justify-content-between">
                    <span class="form-label fw-bold">Giảm giá</span>
                    <span id="discount-amount">0đ</span>
                </div>

                <hr>

                <div class="d-flex justify-content-between fw-bold text-danger fs-5">
                    <span>Tổng</span>
                    <span id="total-amount">0đ</span>
                </div>

                <button class="btn btn-success w-100 mt-3" onclick="placeOrder()">
                    <i class="fas fa-check-circle"></i> Đặt món
                </button>
            </div>
        </div>

    </div>
</div>

<script src="./DemoCart.js"></script>
<script src="./Cart.js"></script>
</body>
</html>
